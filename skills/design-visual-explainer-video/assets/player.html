<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
/*{{FONT_FACES}}*/
html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 14px system-ui, sans-serif; }
#wrap { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#stage { max-width: 100%; max-height: calc(100% - 56px); aspect-ratio: {{ASPECT}}; background: #000; display: block; cursor: pointer; }
#ui { display: flex; gap: 12px; align-items: center; width: min(100%, 960px); padding: 12px 16px; box-sizing: border-box; }
#ui button { background: #2a2a2a; color: #eee; border: 0; border-radius: 6px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
#seek { flex: 1; }
#time { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
body.render #ui { display: none; }
body.render #stage { max-height: none; max-width: none; width: {{WIDTH}}px; height: {{HEIGHT}}px; }
body.render, body.render #wrap { background: #000; display: block; }
</style>
<div id="wrap">
  <canvas id="stage"></canvas>
  <div id="ui">
    <button id="play" aria-label="Play or pause">▶</button>
    <input id="seek" type="range" min="0" step="0.01" value="0" aria-label="Seek">
    <span id="time">0:00</span>
    <button id="fs" aria-label="Fullscreen">⛶</button>
  </div>
  <audio id="track" preload="auto"></audio>
</div>
<script>window.EXPLAINER = /*{{DATA}}*/;</script>
<script>
/*{{ENGINE}}*/
</script>
<script>

</script>
